name: Gerar APK TRIADES

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget curl \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libtinfo6 \
            cmake libffi-dev libssl-dev automake \
            autopoint gettext libltdl-dev

      - name: Instalar Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Instalar Android Command Line Tools
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME/android-sdk"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q commandlinetools-linux-13114758_latest.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Aceitar licenças Android
        run: |
          yes | sdkmanager --licenses || true

      - name: Instalar componentes Android
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;37.0.0"

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install legacy-cgi
          python -m pip install "cython==0.29.34"
          python -m pip install git+https://github.com/kivy/buildozer.git

      - name: Gerar APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          P4A_ACCEPT_LICENSE: "1"
        run: |
          buildozer -v android debug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: TRIADES-APK
          path: bin/*.apk
          if-no-files-found: error
