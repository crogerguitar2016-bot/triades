name: Gerar APK TRIADES

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libtinfo6 \
            cmake libffi-dev libssl-dev automake \
            autopoint gettext libltdl-dev

      - name: Instalar Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install legacy-cgi
          python -m pip install "cython==0.29.34"
          python -m pip install git+https://github.com/kivy/buildozer.git

      - name: Aceitar licenças Android
        run: |
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/licenses"
          yes | sdkmanager --licenses || true

      - name: Gerar APK
        env:
          P4A_ACCEPT_LICENSE: "1"
        run: |
          buildozer -v android debug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: TRIADES-APK
          path: bin/*.apk
          if-no-files-found: error
